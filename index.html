
<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT: Мұғалімге арналған 10 тиімді тәсіл</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.6; background: #f9fbfd; }
    header { background-color: #3A86FF; color: white; padding: 20px; text-align: center; }
    section { padding: 20px; max-width: 1000px; margin: auto; }
    h1, h2 { color: #264653; }
    .tip { margin-bottom: 20px; padding: 15px; border-left: 6px solid #3A86FF; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .prompt { font-style: italic; background: #fffbe0; padding: 10px; margin-top: 10px; border-radius: 5px; }
    .desc { margin-top: 8px; color: #333; }
    footer { background: #eee; text-align: center; padding: 15px; margin-top: 30px; font-size: 14px; }
    .filters { text-align: center; margin-bottom: 30px; }
    .filters button { background: #3A86FF; color: white; border: none; padding: 10px 15px; margin: 5px; border-radius: 5px; cursor: pointer; }
    .filters button:hover { background: #265fce; }
  </style>
  <script>
    function filterTips(keyword) {
      const tips = document.querySelectorAll('.tip');
      tips.forEach(tip => {
        tip.style.display = tip.textContent.toLowerCase().includes(keyword.toLowerCase()) ? 'block' : 'none';
      });
    }
  </script>
</head>
<body>
  <header>
    <h1>Мұғалімнің жұмысын жеңілдететін ChatGPT-тің 10+ тәсілі</h1>
    <p>Сандық дәуірдегі білім беру көмекшіңіз</p>
  </header>

  <section>
    <div class="filters">
      <button onclick="filterTips('')">Барлығы</button>
      <button onclick="filterTips('эссе')">Қазақ тілі</button>
      <button onclick="filterTips('биология')">Жаратылыстану</button>
      <button onclick="filterTips('рефлексия')">Бағалау</button>
      <button onclick="filterTips('мотивация')">Тәрбие</button>
    </div>

    <!-- Tip blocks stay unchanged -->
    <!-- Existing .tip blocks remain as they are, now enhanced with style/filtering -->

  </section>
  <footer>
    &copy; 2025 Мұғалімдерге арналған цифрлық көмекші | ChatGPT-пен бірге
  </footer>
</body>
</html>
